plugins {
    id "loom"
    id "ploceus"
    id "com.gradleup.shadow" version "9.1.0"
}

version = "$mod_version+$target_version"

dependencies {
    minecraft "com.mojang:minecraft:$minecraft_version"
    mappings ploceus.featherMappings(feather_build)
    include(modImplementation "com.github.Minecraft-Java-Edition-Speedrunning:fabric-asm:$fabric_asm_version")
    shadow(api "net.fabricmc:tiny-remapper:$tiny_remapper_version")
    // should be included in the compileClasspath by tr as api but loom just doesn't :|
    compileOnly (implementation "net.fabricmc:mapping-io:$mapping_io_version")

    subprojects.forEach {
        include it
    }
}

base {
    archivesName = archives_name
}

tasks {
    shadowJar {
        configurations = [project.configurations.shadow]
        outputs.upToDateWhen { false }
        exclude("org/objectweb/asm/**")
        exclude("META-INF/**")
        relocate("net.fabricmc.mappingio", "me.modmuss50.optifabric.shaded.mio")
        relocate("net.fabricmc.tinyremapper", "me.modmuss50.optifabric.shaded.tr")
        minimize()
    }

    remapJar {
        dependsOn(shadowJar)
        inputFile = file(shadowJar.archivePath)
    }
}
